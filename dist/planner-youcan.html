<html lang=&quot;en&quot;>
<head>

  <meta name=&quot;description&quot; content=&quot;AZOUMAG Planner — the ultimate offline-first web planner. Goals, habits, weekly focus, brain dump. Works entirely in your browser.&quot; />

  <style>
/* AZOUMAG Planner — All styles scoped under #az-planner (AZOUMAG rule) */

#az-planner {
  --az-orange: #F37021;
  --az-orange-soft: #ff8f4d;
  --az-navy: #1D2240;
  --az-navy-deep: #12162B;
  --az-navy-light: #3D4573;
  --az-offwhite: #FFF4EC;
  --az-black: #111111;

  --az-glass-bg: rgba(255, 255, 255, 0.06);
  --az-glass-border: rgba(255, 255, 255, 0.12);
  --az-glass-blur: 16px;

  --az-radius: 12px;
  --az-radius-lg: 16px;
  --az-gap: 20px;

  font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, sans-serif;
  color: var(--az-offwhite);
  min-height: 100vh;
  background: var(--az-navy);
  position: relative;
  overflow-x: hidden;
  line-height: 1.5;
}

#az-planner * { box-sizing: border-box; }

/* Aurora background */
#az-planner::before {
  content: &quot;&quot;;
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(243, 112, 33, 0.20), transparent 60%),
    radial-gradient(50% 40% at 80% 80%, rgba(61, 69, 115, 0.55), transparent 60%),
    radial-gradient(40% 30% at 50% 100%, rgba(243, 112, 33, 0.10), transparent 60%);
  animation: az-aurora 22s ease-in-out infinite alternate;
}
@keyframes az-aurora {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(3%, -3%) scale(1.08); }
}

/* Header */
#az-planner .az-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px 32px;
  background: var(--az-glass-bg);
  backdrop-filter: blur(var(--az-glass-blur));
  -webkit-backdrop-filter: blur(var(--az-glass-blur));
  border-bottom: 1px solid var(--az-glass-border);
  flex-wrap: wrap;
}
#az-planner .az-brand { display: flex; gap: 14px; align-items: center; }
#az-planner .az-logo {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: var(--az-radius);
  background: linear-gradient(135deg, var(--az-orange), var(--az-orange-soft));
  font-weight: 800;
  color: white;
  box-shadow: 0 4px 20px rgba(243, 112, 33, 0.4);
  letter-spacing: 0.5px;
}
#az-planner h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--az-orange), #ffb27a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
#az-planner .az-slogan { margin: 0; font-size: 12px; opacity: 0.7; }
#az-planner .az-shop-info { text-align: right; font-size: 13px; opacity: 0.8; }
#az-planner .az-shop-name { display: block; font-weight: 600; }
#az-planner .az-date { display: block; opacity: 0.6; font-size: 12px; }

/* Tabs */
#az-planner .az-tabs {
  display: flex; gap: 4px;
  padding: 12px 32px;
  background: var(--az-glass-bg);
  border-bottom: 1px solid var(--az-glass-border);
  overflow-x: auto;
  scrollbar-width: thin;
}
#az-planner .az-tab {
  padding: 10px 18px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--az-offwhite);
  opacity: 0.6;
  cursor: pointer;
  border-radius: var(--az-radius);
  transition: all 0.2s ease;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
#az-planner .az-tab:hover { opacity: 1; background: rgba(255,255,255,0.05); }
#az-planner .az-tab-active {
  opacity: 1;
  background: linear-gradient(135deg, rgba(243,112,33,0.20), rgba(243,112,33,0.05));
  border-color: rgba(243,112,33,0.35);
  color: var(--az-offwhite);
}

/* Main */
#az-planner .az-main { padding: 32px; max-width: 1200px; margin: 0 auto; }
#az-planner .az-view { display: none; animation: az-fade 0.25s ease; }
#az-planner .az-view-active { display: block; }
@keyframes az-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
#az-planner .az-view-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
#az-planner h2 { margin: 0; font-size: 26px; font-weight: 700; }
#az-planner h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
#az-planner .az-muted { opacity: 0.6; font-size: 14px; }
#az-planner .az-lead { font-size: 16px; opacity: 0.85; max-width: 640px; }

/* Hero */
#az-planner .az-hero { margin-bottom: 24px; }

/* Grid */
#az-planner .az-grid { display: grid; gap: var(--az-gap); }
#az-planner .az-grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
#az-planner .az-grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
#az-planner .az-grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* Cards */
#az-planner .az-card {
  padding: 24px;
  background: var(--az-glass-bg);
  backdrop-filter: blur(var(--az-glass-blur));
  -webkit-backdrop-filter: blur(var(--az-glass-blur));
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
}
#az-planner .az-list { margin: 0; padding-left: 18px; font-size: 14px; opacity: 0.85; }
#az-planner .az-list li { margin-bottom: 4px; }

/* KPI cards */
#az-planner .az-kpi {
  padding: 20px 22px;
  background: var(--az-glass-bg);
  backdrop-filter: blur(var(--az-glass-blur));
  -webkit-backdrop-filter: blur(var(--az-glass-blur));
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
}
#az-planner .az-kpi-value {
  font-size: 34px;
  font-weight: 800;
  line-height: 1.1;
  background: linear-gradient(90deg, var(--az-orange), #ffb27a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
#az-planner .az-kpi-label {
  margin-top: 4px;
  font-size: 12px;
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* Badge + chips */
#az-planner .az-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(243,112,33,0.15);
  border: 1px solid rgba(243,112,33,0.35);
  color: var(--az-orange);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
#az-planner .az-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--az-glass-border);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
#az-planner .az-chip-status[data-status=&quot;Not Started&quot;] { background: rgba(255,255,255,0.08); }
#az-planner .az-chip-status[data-status=&quot;In Progress&quot;] { background: rgba(243,112,33,0.18); border-color: rgba(243,112,33,0.4); color: var(--az-orange); }
#az-planner .az-chip-status[data-status=&quot;Waiting&quot;]     { background: rgba(255,200,60,0.15); border-color: rgba(255,200,60,0.4); color: #ffd166; }
#az-planner .az-chip-status[data-status=&quot;Done&quot;]        { background: rgba(80,200,120,0.18); border-color: rgba(80,200,120,0.4); color: #7ed6a0; }

/* Buttons */
#az-planner .az-btn {
  padding: 12px 24px;
  border: none;
  border-radius: var(--az-radius);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  display: inline-block;
  font-family: inherit;
  text-align: center;
}
#az-planner .az-btn-sm { padding: 6px 12px; font-size: 12px; }
#az-planner .az-btn-primary {
  background: linear-gradient(135deg, var(--az-orange), var(--az-orange-soft));
  color: white;
  box-shadow: 0 4px 20px rgba(243,112,33,0.30);
}
#az-planner .az-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(243,112,33,0.50); }
#az-planner .az-btn-ghost {
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  color: var(--az-offwhite);
}
#az-planner .az-btn-ghost:hover { background: rgba(255,255,255,0.10); }
#az-planner .az-btn-danger {
  background: #d33;
  color: white;
}
#az-planner .az-btn-danger:hover { background: #b52a2a; }

/* Forms */
#az-planner .az-form {
  max-width: 520px;
  padding: 24px;
  background: var(--az-glass-bg);
  backdrop-filter: blur(var(--az-glass-blur));
  -webkit-backdrop-filter: blur(var(--az-glass-blur));
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
  margin-bottom: 20px;
}
#az-planner .az-form label { display: block; margin-bottom: 14px; }
#az-planner .az-form label span { display: block; font-size: 13px; opacity: 0.7; margin-bottom: 6px; }
#az-planner .az-form input,
#az-planner .az-form select,
#az-planner .az-form textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--az-glass-border);
  background: rgba(0,0,0,0.20);
  color: var(--az-offwhite);
  border-radius: var(--az-radius);
  font-family: inherit;
  font-size: 14px;
}
#az-planner .az-form textarea { resize: vertical; min-height: 90px; }
#az-planner .az-form input:focus,
#az-planner .az-form select:focus,
#az-planner .az-form textarea:focus {
  outline: none;
  border-color: rgba(243,112,33,0.6);
  background: rgba(0,0,0,0.30);
}
#az-planner .az-form-row { display: flex; flex-wrap: wrap; gap: 14px; }
#az-planner .az-form-row label { flex: 1 1 200px; margin-bottom: 0; }
#az-planner .az-form-actions { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#az-planner .az-backup-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
#az-planner .az-backup-info { font-size: 13px; opacity: 0.7; }
#az-planner .az-danger-zone { border-color: rgba(220,60,60,0.35); }

/* Empty state */
#az-planner .az-empty {
  padding: 24px;
  border: 1px dashed var(--az-glass-border);
  border-radius: var(--az-radius-lg);
  color: var(--az-offwhite);
  opacity: 0.6;
  text-align: center;
  font-size: 14px;
}

/* CRUD item (goals, notes, brain dump…) */
#az-planner .az-item {
  padding: 18px 20px;
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
  margin-bottom: 12px;
}
#az-planner .az-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
#az-planner .az-item-title { margin: 0; font-weight: 600; font-size: 15px; }
#az-planner .az-item-meta { display: flex; gap: 6px; flex-wrap: wrap; }
#az-planner .az-item-body { margin: 10px 0; font-size: 14px; opacity: 0.85; }
#az-planner .az-item-body p { margin: 4px 0; }
#az-planner .az-item-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
#az-planner .az-item-actions input[type=&quot;range&quot;] { flex: 1 1 160px; }
#az-planner .az-item-actions select {
  padding: 6px 10px; font-size: 13px;
  background: rgba(0,0,0,0.20); color: var(--az-offwhite);
  border: 1px solid var(--az-glass-border); border-radius: var(--az-radius);
}

/* Progress bar */
#az-planner .az-progress {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 4px;
}
#az-planner .az-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--az-orange), var(--az-orange-soft));
  transition: width 0.25s ease;
}

/* Month nav */
#az-planner .az-month-nav {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 12px 16px;
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
}
#az-planner .az-month-nav input[type=&quot;month&quot;] {
  padding: 8px 12px;
  background: rgba(0,0,0,0.20);
  color: var(--az-offwhite);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius);
  font-family: inherit;
  font-size: 14px;
}

/* Habits */
#az-planner .az-habit-row {
  display: flex; gap: 14px; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius-lg);
  margin-bottom: 10px;
  flex-wrap: wrap;
}
#az-planner .az-habit-info { min-width: 180px; }
#az-planner .az-habit-name { font-weight: 600; font-size: 15px; }
#az-planner .az-habit-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; opacity: 0.75; margin-top: 4px; flex-wrap: wrap; }
#az-planner .az-habit-days { display: flex; gap: 4px; }
#az-planner .az-habit-day {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 1px solid var(--az-glass-border);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  padding: 0;
  transition: transform 0.1s ease;
}
#az-planner .az-habit-day:hover { transform: scale(1.15); }
#az-planner .az-habit-day[data-state=&quot;done&quot;] { background: linear-gradient(135deg, var(--az-orange), var(--az-orange-soft)); border-color: transparent; }
#az-planner .az-habit-day[data-state=&quot;miss&quot;] { background: rgba(220,60,60,0.35); border-color: rgba(220,60,60,0.5); }
#az-planner .az-habit-day[data-today=&quot;1&quot;] { box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
#az-planner .az-habit-delete { margin-left: 10px; }

/* Weekly grid — 7 day columns */
#az-planner .az-week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 16px;
  overflow-x: auto;
}
#az-planner .az-week-day {
  padding: 12px;
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius);
  display: flex;
  flex-direction: column;
}
#az-planner .az-week-day h4 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.75;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#az-planner .az-week-day textarea {
  width: 100%;
  min-height: 120px;
  padding: 8px 10px;
  border: 1px solid var(--az-glass-border);
  background: rgba(0,0,0,0.20);
  color: var(--az-offwhite);
  border-radius: var(--az-radius);
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
}
#az-planner .az-week-day textarea:focus {
  outline: none;
  border-color: rgba(243,112,33,0.6);
  background: rgba(0,0,0,0.30);
}
#az-planner .az-weekly-title { display: inline-flex; gap: 8px; align-items: baseline; }

/* Daily picker */
#az-planner .az-month-nav input[type=&quot;date&quot;] {
  padding: 8px 12px;
  background: rgba(0,0,0,0.20);
  color: var(--az-offwhite);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius);
  font-family: inherit;
  font-size: 14px;
}

/* Notes */
#az-planner .az-note-body {
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* Brain Dump items */
#az-planner .az-bd-item {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: var(--az-glass-bg);
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius);
  margin-bottom: 8px;
}
#az-planner .az-bd-check { display: flex; align-items: center; }
#az-planner .az-bd-check input[type=&quot;checkbox&quot;] {
  width: 18px; height: 18px;
  accent-color: var(--az-orange);
  cursor: pointer;
}
#az-planner .az-bd-text { flex: 1 1 auto; font-size: 14px; word-break: break-word; }
#az-planner .az-bd-done .az-bd-text { text-decoration: line-through; opacity: 0.55; }
#az-planner .az-bd-prio[data-prio=&quot;high&quot;] { background: rgba(220,60,60,0.18); border-color: rgba(220,60,60,0.4); color: #ff8a8a; }
#az-planner .az-bd-prio[data-prio=&quot;med&quot;]  { background: rgba(255,200,60,0.15); border-color: rgba(255,200,60,0.4); color: #ffd166; }
#az-planner .az-bd-prio[data-prio=&quot;low&quot;]  { background: rgba(120,180,255,0.15); border-color: rgba(120,180,255,0.35); color: #a8c8ff; }

/* Toast */
#az-planner .az-toast {
  position: fixed;
  top: 20px; left: 50%;
  transform: translate(-50%, -80px);
  padding: 12px 24px;
  background: var(--az-glass-bg);
  backdrop-filter: blur(var(--az-glass-blur));
  -webkit-backdrop-filter: blur(var(--az-glass-blur));
  border: 1px solid var(--az-glass-border);
  border-radius: var(--az-radius);
  transition: transform 0.3s ease;
  z-index: 100;
  font-size: 14px;
  color: var(--az-offwhite);
}
#az-planner .az-toast-show { transform: translate(-50%, 0); }
#az-planner .az-toast-error { border-color: rgba(220,60,60,0.5); }

/* Footer */
#az-planner .az-footer {
  padding: 20px;
  text-align: center;
  opacity: 0.5;
  font-size: 12px;
}

/* Responsive */
@media (max-width: 640px) {
  #az-planner .az-header { padding: 16px 20px; }
  #az-planner .az-tabs { padding: 8px 16px; }
  #az-planner .az-main { padding: 20px 16px; }
  #az-planner h1 { font-size: 18px; }
  #az-planner h2 { font-size: 22px; }
  #az-planner .az-kpi-value { font-size: 28px; }
  #az-planner .az-habit-row { flex-direction: column; align-items: flex-start; }
  #az-planner .az-week-grid { grid-template-columns: 1fr; }
  #az-planner .az-bd-item { flex-wrap: wrap; }
}

/* Print */
@media print {
  #az-planner { background: white; color: black; }
  #az-planner::before,
  #az-planner .az-header,
  #az-planner .az-tabs,
  #az-planner .az-footer,
  #az-planner .az-toast { display: none; }
  #az-planner .az-view { display: block !important; page-break-after: always; }
  #az-planner[data-print-section] .az-view { display: none !important; page-break-after: auto; }
  #az-planner[data-print-section=&quot;monthly&quot;] #az-view-monthly,
  #az-planner[data-print-section=&quot;weekly&quot;]  #az-view-weekly,
  #az-planner[data-print-section=&quot;daily&quot;]   #az-view-daily,
  #az-planner[data-print-section=&quot;year-goals&quot;] #az-view-year-goals,
  #az-planner[data-print-section=&quot;habits&quot;]  #az-view-habits,
  #az-planner[data-print-section=&quot;notes&quot;]   #az-view-notes,
  #az-planner[data-print-section=&quot;brain-dump&quot;] #az-view-brain-dump { display: block !important; }
  #az-planner .az-view-head button,
  #az-planner .az-form-actions,
  #az-planner .az-item-actions,
  #az-planner .az-backup-actions { display: none !important; }
  #az-planner .az-card,
  #az-planner .az-kpi,
  #az-planner .az-item,
  #az-planner .az-habit-row,
  #az-planner .az-week-day,
  #az-planner .az-bd-item { border: 1px solid #ccc; background: white; }
  #az-planner .az-kpi-value { color: #F37021; -webkit-text-fill-color: initial; }
}

</style>
</head>
<body>
  <div id=&quot;az-planner&quot;>

    <header class=&quot;az-header&quot;>
      <div class=&quot;az-brand&quot;>
        <span class=&quot;az-logo&quot; aria-hidden=&quot;true&quot;>AZ</span>
        <div>
          <h1>AZOUMAG Planner</h1>
          <p class=&quot;az-slogan&quot;>Plan calmly. Reset weekly. Ship consistently.</p>
        </div>

/* AZOUMAG Planner — Storage layer (LocalStorage + JSON backup/restore) */
(function (global) {
  'use strict';

  const APP_SIGNATURE = 'AZOUMAG PLANNER';
  const SCHEMA_VERSION = 1;

  const K = {
    settings:   'az_planner_settings',
    yearGoals:  'az_planner_year_goals',
    habits:     'az_planner_habits',
    monthly:    'az_planner_monthly',
    weekly:     'az_planner_weekly',
    daily:      'az_planner_daily',
    notes:      'az_planner_notes',
    brainDump:  'az_planner_brain_dump',
    license:    'az_planner_license',
    meta:       'az_planner_meta',
  };

  function read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const parsed = JSON.parse(raw);
      return parsed === null ? fallback : parsed;
    } catch (e) {
      return fallback;
    }
  }

  function write(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  const defaultSettings = () => ({
    plannerName: 'Your Planner',
    year: new Date().getFullYear(),
    theme: 'base',
    createdAt: new Date().toISOString(),
  });

  const AZStorage = {
    // Settings
    getSettings() { return read(K.settings, defaultSettings()); },
    saveSettings(s) { write(K.settings, s); this.touchMeta(); },

    // Year Goals — [{id, goal, category, quarter, deadline, status, progress, successMetric, nextAction}]
    getYearGoals() { return read(K.yearGoals, []); },
    saveYearGoals(list) { write(K.yearGoals, list); this.touchMeta(); },

    // Habits — [{id, habit, category, target, values: {'2026-08-26': 1, ...}}]
    getHabits() { return read(K.habits, []); },
    saveHabits(list) { write(K.habits, list); this.touchMeta(); },

    // Monthly — {'2026-08': {priorities: [], notes: '', importantDates: []}}
    getMonthly() { return read(K.monthly, {}); },
    saveMonthly(map) { write(K.monthly, map); this.touchMeta(); },

    // Weekly — {'2026-W35': {focus: '', mon: [], tue: [], ...}}
    getWeekly() { return read(K.weekly, {}); },
    saveWeekly(map) { write(K.weekly, map); this.touchMeta(); },

    // Daily — {'2026-08-26': {topThree: [], schedule: [], gratitude: '', reflection: ''}}
    getDaily() { return read(K.daily, {}); },
    saveDaily(map) { write(K.daily, map); this.touchMeta(); },

    // Notes — [{id, title, body, updatedAt}]
    getNotes() { return read(K.notes, []); },
    saveNotes(list) { write(K.notes, list); this.touchMeta(); },

    // Brain Dump — [{id, text, priority, createdAt}]
    getBrainDump() { return read(K.brainDump, []); },
    saveBrainDump(list) { write(K.brainDump, list); this.touchMeta(); },

    // Meta (last modified, last backup)
    getMeta() { return read(K.meta, { updatedAt: null, lastBackupAt: null }); },
    touchMeta() {
      const meta = this.getMeta();
      meta.updatedAt = new Date().toISOString();
      write(K.meta, meta);
    },
    markBackupDone() {
      const meta = this.getMeta();
      meta.lastBackupAt = new Date().toISOString();
      write(K.meta, meta);
    },

    // ID generator
    newId(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    },

    // Full snapshot for backup
    exportAll() {
      return {
        app: APP_SIGNATURE,
        version: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        data: {
          settings:  this.getSettings(),
          yearGoals: this.getYearGoals(),
          habits:    this.getHabits(),
          monthly:   this.getMonthly(),
          weekly:    this.getWeekly(),
          daily:     this.getDaily(),
          notes:     this.getNotes(),
          brainDump: this.getBrainDump(),
          license:   read(K.license, null),
        },
      };
    },

    importAll(payload, mode) {
      mode = mode || 'replace';
      if (!payload || typeof payload !== 'object') {
        return { ok: false, error: 'Empty or invalid payload' };
      }
      if (payload.app !== APP_SIGNATURE) {
        return { ok: false, error: 'This backup does not belong to AZOUMAG PLANNER' };
      }
      if (!payload.data || typeof payload.data !== 'object') {
        return { ok: false, error: 'Backup structure is invalid' };
      }
      const d = payload.data;

      if (mode === 'replace') {
        if (d.settings)  this.saveSettings(d.settings);
        if (d.yearGoals) this.saveYearGoals(d.yearGoals);
        if (d.habits)    this.saveHabits(d.habits);
        if (d.monthly)   this.saveMonthly(d.monthly);
        if (d.weekly)    this.saveWeekly(d.weekly);
        if (d.daily)     this.saveDaily(d.daily);
        if (d.notes)     this.saveNotes(d.notes);
        if (d.brainDump) this.saveBrainDump(d.brainDump);
        if (d.license)   write(K.license, d.license);
      } else if (mode === 'merge') {
        if (Array.isArray(d.yearGoals)) this.saveYearGoals([...this.getYearGoals(), ...d.yearGoals]);
        if (Array.isArray(d.habits))    this.saveHabits([...this.getHabits(), ...d.habits]);
        if (Array.isArray(d.notes))     this.saveNotes([...this.getNotes(), ...d.notes]);
        if (Array.isArray(d.brainDump)) this.saveBrainDump([...this.getBrainDump(), ...d.brainDump]);
        if (d.monthly) this.saveMonthly(Object.assign({}, this.getMonthly(), d.monthly));
        if (d.weekly)  this.saveWeekly(Object.assign({}, this.getWeekly(), d.weekly));
        if (d.daily)   this.saveDaily(Object.assign({}, this.getDaily(), d.daily));
      }
      return { ok: true };
    },

    resetAll() {
      Object.values(K).forEach(k => localStorage.removeItem(k));
    },

    buildBackupFilename() {
      const s = this.getSettings();
      const shop = (s.plannerName || 'planner').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'planner';
      const date = new Date().toISOString().slice(0, 10);
      return `azoumag-planner-${shop}-${date}.json`;
    },
  };

  global.AZStorage = AZStorage;
  global.AZ_PLANNER_VERSION = '0.1.0';
})(window);

</script>
  <script>
/* AZOUMAG Planner — License keys (offline HMAC-SHA256 verification) */
/* ponytail: secret is embedded — crackable by anyone reading the source.
   Acceptable for BSL honor-system gating. Upgrade to server verification
   when there's paid revenue to justify it. */
(function (global) {
  'use strict';

  const SECRET = 'azoumag-planner-v1-2026-secret';
  const STORAGE_KEY = 'az_planner_license';
  const KEY_RE = /^AZOUMAG-PRO-([A-Z0-9]{8})-([a-f0-9]{12})$/;

  async function hmacHex(msg) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
      'raw', enc.encode(SECRET),
      { name: 'HMAC', hash: 'SHA-256' },
      false, ['sign']
    );
    const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
    return Array.from(new Uint8Array(sig))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function verify(rawKey) {
    if (typeof rawKey !== 'string') return false;
    const key = rawKey.trim().toUpperCase().replace(/^AZOUMAG-PRO-/, 'AZOUMAG-PRO-');
    const m = key.match(/^AZOUMAG-PRO-([A-Z0-9]{8})-([A-F0-9]{12})$/i);
    if (!m) return false;
    const [, id, sig] = m;
    const expected = (await hmacHex('PRO:' + id)).slice(0, 12);
    return sig.toLowerCase() === expected;
  }

  function readStored() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; }
    catch (e) { return null; }
  }

  const AZLicense = {
    async activate(rawKey) {
      const ok = await verify(rawKey);
      if (!ok) return { ok: false, error: 'Invalid license key' };
      const record = {
        key: rawKey.trim().toUpperCase(),
        tier: 'pro',
        activatedAt: new Date().toISOString(),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
      document.dispatchEvent(new CustomEvent('az-license-changed'));
      return { ok: true, tier: 'pro' };
    },

    deactivate() {
      localStorage.removeItem(STORAGE_KEY);
      document.dispatchEvent(new CustomEvent('az-license-changed'));
    },

    getRecord() { return readStored(); },
    getTier() { return (readStored() || {}).tier || 'free'; },
    isPro() { return this.getTier() === 'pro'; },

    async revalidate() {
      const rec = readStored();
      if (!rec || !rec.key) return;
      const ok = await verify(rec.key);
      if (!ok) this.deactivate();
    },
  };

  global.AZLicense = AZLicense;
})(window);

</script>

/* AZOUMAG Planner — Dashboard: KPI cards + top goals + today's habits */
(function () {
  'use strict';

  function todayKey() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function dayKey(offset) {
    const d = new Date();
    d.setDate(d.getDate() - offset);
    return d.toISOString().slice(0, 10);
  }

  function currentStreak(habit) {
    const values = habit.values || {};
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 365; i++) {
      const k = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i).toISOString().slice(0, 10);
      if (values[k] === 1) streak++;
      else break;
    }
    return streak;
  }

  function habitCompletionRate(habits, days) {
    if (!habits.length || !days) return null;
    let hits = 0;
    for (const h of habits) {
      const v = h.values || {};
      for (let i = 0; i < days; i++) {
        if (v[dayKey(i)] === 1) hits++;
      }
    }
    const possible = habits.length * days;
    return { hits, possible, pct: Math.round((hits / possible) * 100) };
  }

  function yearProgress() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const end = new Date(now.getFullYear() + 1, 0, 1);
    const day = Math.floor((now - start) / 86400000) + 1;
    const total = Math.round((end - start) / 86400000);
    return { day, total, pct: Math.round((day / total) * 100) };
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&amp;<>&quot;']/g, c => (

    ));

  const AZDashboard = {

      const goals = AZStorage.getYearGoals();
      const habits = AZStorage.getHabits();
      const bd = AZStorage.getBrainDump();

      const yp = yearProgress();
      const yearFrac = yp.day / yp.total;
      const onTrackCount = goals.filter(g =>
        g.status !== 'Done' &amp;&amp; (g.progress || 0) >= yearFrac
      ).length;
      const streaks = habits.map(currentStreak);
      const longest = streaks.length ? Math.max.apply(null, streaks) : 0;
      const week = habitCompletionRate(habits, 7);
      const month = habitCompletionRate(habits, 30);
      const openBd = bd.filter(x => !x.done).length;

      set('az-dash-total-goals', goals.length);
      set('az-dash-ontrack-goals', onTrackCount);
      set('az-dash-total-habits', habits.length);
      set('az-dash-longest-streak', longest);
      set('az-dash-year-progress', `${yp.day}/${yp.total} · ${yp.pct}%`);
      set('az-dash-week-habits', week ? `${week.hits}/${week.possible} · ${week.pct}%` : '—');

                <div class=&quot;az-muted&quot; style=&quot;font-size:12px;&quot;>${pct}% · ${escapeHtml(g.status || '')}</div>
              </div>

      }

      // Today's habits
      const todayBox = document.getElementById('az-dash-today-habits');

          todayBox.className = 'az-empty';

(function () {

  const DAYS_BACK = 14;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&amp;<>&quot;']/g, c => (
      { '&amp;': '&amp;amp;', '<': '&amp;lt;', '>': '&amp;gt;', '&quot;': '&amp;quot;', &quot;'&quot;: '&amp;#39;' }[c]

  function ymd(d) { return d.toISOString().slice(0, 10); }

    document.dispatchEvent(new CustomEvent('az-data-changed'));
  }

  function currentStreak(values) {
    values = values || {};
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 365; i++) {
      const k = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - i));
      if (values[k] === 1) streak++;
      else break;
    }
    return streak;
  }

  function monthDone(values) {
    values = values || {};
    const d = new Date();
    let count = 0;
    for (let i = 1; i <= d.getDate(); i++) {
      const k = ymd(new Date(d.getFullYear(), d.getMonth(), i));
      if (values[k] === 1) count++;
    }
    return count;

    render() {

      if (!box) return;

      if (list.length === 0) {
        box.innerHTML = '<div class=&quot;az-empty&quot;>No habits yet. Add your first above.</div>';
        return;
      }

      const today = new Date();
      const dayKeys = [];
      for (let i = DAYS_BACK - 1; i >= 0; i--) {
        dayKeys.push(ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i)));
      }
      const todayKey = ymd(today);

      box.innerHTML = list.map(h => {
        const streak = currentStreak(h.values);
        const done = monthDone(h.values);
        const target = h.target || 20;
        const values = h.values || {};

        const squares = dayKeys.map(k => {
          const v = values[k];
          let state = 'empty';
          if (v === 1) state = 'done';
          else if (v === 0) state = 'miss';
          const isToday = k === todayKey ? '1' : '0';
          const label = k + (state === 'done' ? ' — done' : state === 'miss' ? ' — missed' : '');
          return `<button type=&quot;button&quot; class=&quot;az-habit-day&quot; data-state=&quot;${state}&quot; data-today=&quot;${isToday}&quot; data-habit=&quot;${escapeHtml(h.id)}&quot; data-date=&quot;${k}&quot; title=&quot;${label}&quot; aria-label=&quot;${label}&quot;></button>`;
        }).join('');

        return `
          <div class=&quot;az-habit-row&quot; data-id=&quot;${escapeHtml(h.id)}&quot;>
            <div class=&quot;az-habit-info&quot;>
              <div class=&quot;az-habit-name&quot;>${escapeHtml(h.habit)}</div>

              <button class=&quot;az-btn az-btn-ghost az-btn-sm az-habit-delete&quot; data-h-delete=&quot;${escapeHtml(h.id)}&quot; title=&quot;Delete habit&quot;>✕</button>

      this.render();
      fireChange();

    cycleDay(habitId, dateKey) {

      const i = list.findIndex(x => x.id === habitId);
      if (i === -1) return;
      const values = list[i].values || {};
      const cur = values[dateKey];
      // empty → done → miss → empty
      if (cur === undefined) values[dateKey] = 1;
      else if (cur === 1) values[dateKey] = 0;

      AZStorage.saveHabits(list);
      this.render();
      fireChange();

/* AZOUMAG Planner — Weekly Planner: per ISO-week focus + 7 day columns + reflection */
(function () {
  'use strict';

  const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  const DAY_LABELS = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };

  function isoWeekKey(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
  }

  function parseWeekKey(key) {
    const m = /^(\d{4})-W(\d{1,2})$/.exec(key);
    if (!m) return null;
    return { year: parseInt(m[1], 10), week: parseInt(m[2], 10) };
  }

  function mondayOfIsoWeek(year, week) {
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const jan4Day = jan4.getUTCDay() || 7;
    const monday = new Date(Date.UTC(year, 0, 4));
    monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1 + (week - 1) * 7);
    return monday;
  }

  function shiftWeek(key, delta) {
    const p = parseWeekKey(key);
    if (!p) return isoWeekKey(new Date());
    const mon = mondayOfIsoWeek(p.year, p.week);
    mon.setUTCDate(mon.getUTCDate() + delta * 7);
    return isoWeekKey(new Date(mon.getUTCFullYear(), mon.getUTCMonth(), mon.getUTCDate()));
  }

  function weekRangeLabel(key) {
    const p = parseWeekKey(key);
    if (!p) return '';
    const mon = mondayOfIsoWeek(p.year, p.week);
    const sun = new Date(mon);
    sun.setUTCDate(mon.getUTCDate() + 6);
    const fmt = (d) => d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' });
    return fmt(new Date(mon.getUTCFullYear(), mon.getUTCMonth(), mon.getUTCDate())) + ' → ' +
           fmt(new Date(sun.getUTCFullYear(), sun.getUTCMonth(), sun.getUTCDate()));
  }

  function fireChange() {
    document.dispatchEvent(new CustomEvent('az-data-changed'));
  }

  const AZWeekly = {
    currentKey: null,

    load(key) {
      this.currentKey = key;
      const all = AZStorage.getWeekly();
      const rec = all[key] || { focus: '', mon: '', tue: '', wed: '', thu: '', fri: '', sat: '', sun: '', reflection: '' };
      const focus = document.getElementById('az-weekly-focus');
      const refl = document.getElementById('az-weekly-reflection');
      const rangeEl = document.getElementById('az-weekly-range');
      const label = document.getElementById('az-weekly-label');
      const saved = document.getElementById('az-weekly-saved');
      if (focus) focus.value = rec.focus || '';
      if (refl) refl.value = rec.reflection || '';
      if (rangeEl) rangeEl.textContent = weekRangeLabel(key);
      if (label) label.textContent = key;
      if (saved) saved.textContent = '';
      DAYS.forEach(d => {
        const ta = document.getElementById('az-weekly-day-' + d);
        if (ta) ta.value = rec[d] || '';
      });
    },

    save() {
      if (!this.currentKey) return;
      const all = AZStorage.getWeekly();
      const rec = {
        focus: (document.getElementById('az-weekly-focus').value || ''),
        reflection: (document.getElementById('az-weekly-reflection').value || ''),
      };
      DAYS.forEach(d => {
        const ta = document.getElementById('az-weekly-day-' + d);
        rec[d] = ta ? ta.value || '' : '';
      });
      all[this.currentKey] = rec;
      AZStorage.saveWeekly(all);
      const saved = document.getElementById('az-weekly-saved');
      if (saved) saved.textContent = 'Saved · ' + new Date().toLocaleTimeString();
      fireChange();
    },

    init() {
      const prev = document.getElementById('az-weekly-prev');
      const next = document.getElementById('az-weekly-next');
      const today = document.getElementById('az-weekly-today');
      const btnSave = document.getElementById('az-weekly-save');
      if (!btnSave) return;

      this.load(isoWeekKey(new Date()));

      if (prev) prev.addEventListener('click', () => this.load(shiftWeek(this.currentKey, -1)));
      if (next) next.addEventListener('click', () => this.load(shiftWeek(this.currentKey, 1)));
      if (today) today.addEventListener('click', () => this.load(isoWeekKey(new Date())));
      btnSave.addEventListener('click', () => this.save());
    },
  };

  document.addEventListener('DOMContentLoaded', () => AZWeekly.init());
  window.AZWeekly = AZWeekly;
  window.AZWeeklyLabels = DAY_LABELS;
})();

/* AZOUMAG Planner — Brain Dump: quick capture with priority + done toggle */
(function () {
  'use strict';

  const PRIO_ORDER = { high: 0, med: 1, low: 2 };
  const PRIO_LABEL = { high: 'High', med: 'Medium', low: 'Low' };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&amp;<>&quot;']/g, c => (
      { '&amp;': '&amp;amp;', '<': '&amp;lt;', '>': '&amp;gt;', '&quot;': '&amp;quot;', &quot;'&quot;: '&amp;#39;' }[c]
    ));
  }

  function fireChange() {
    document.dispatchEvent(new CustomEvent('az-data-changed'));
  }

  function sortItems(list) {
    return list.slice().sort((a, b) => {
      const doneA = a.done ? 1 : 0;
      const doneB = b.done ? 1 : 0;
      if (doneA !== doneB) return doneA - doneB;
      const pa = PRIO_ORDER[a.priority] == null ? 3 : PRIO_ORDER[a.priority];
      const pb = PRIO_ORDER[b.priority] == null ? 3 : PRIO_ORDER[b.priority];
      if (pa !== pb) return pa - pb;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }

  const AZBrainDump = {
    render() {
      const list = sortItems(AZStorage.getBrainDump());
      const box = document.getElementById('az-bd-list');
      const openCount = document.getElementById('az-bd-open');
      if (openCount) openCount.textContent = String(list.filter(x => !x.done).length);
      if (!box) return;

      if (list.length === 0) {
        box.innerHTML = '<div class=&quot;az-empty&quot;>Nothing yet. Offload what\'s on your mind above.</div>';
        return;
      }

      box.innerHTML = list.map(it => {
        const p = it.priority || 'med';
        return `
          <div class=&quot;az-bd-item${it.done ? ' az-bd-done' : ''}&quot; data-id=&quot;${escapeHtml(it.id)}&quot;>
            <label class=&quot;az-bd-check&quot;>
              <input type=&quot;checkbox&quot; data-bd-done=&quot;${escapeHtml(it.id)}&quot;${it.done ? ' checked' : ''} />
            </label>
            <div class=&quot;az-bd-text&quot;>${escapeHtml(it.text)}</div>
            <span class=&quot;az-chip az-bd-prio&quot; data-prio=&quot;${escapeHtml(p)}&quot;>${escapeHtml(PRIO_LABEL[p] || 'Medium')}</span>
            <button class=&quot;az-btn az-btn-ghost az-btn-sm&quot; data-bd-delete=&quot;${escapeHtml(it.id)}&quot; title=&quot;Delete&quot;>✕</button>
          </div>
        `;
      }).join('');
    },

    add(text, priority) {
      const list = AZStorage.getBrainDump();
      list.push({
        id: AZStorage.newId('bd'),
        text,
        priority: priority || 'med',
        createdAt: new Date().toISOString(),
        done: false,
      });
      AZStorage.saveBrainDump(list);
      this.render();
      fireChange();
    },

    toggle(id) {
      const list = AZStorage.getBrainDump();
      const i = list.findIndex(x => x.id === id);
      if (i === -1) return;
      list[i].done = !list[i].done;
      AZStorage.saveBrainDump(list);
      this.render();
      fireChange();
    },

    remove(id) {
      const list = AZStorage.getBrainDump().filter(x => x.id !== id);
      AZStorage.saveBrainDump(list);
      this.render();
      fireChange();
    },

    clearDone() {
      const list = AZStorage.getBrainDump().filter(x => !x.done);
      AZStorage.saveBrainDump(list);
      this.render();
      fireChange();
    },

    init() {
      const form = document.getElementById('az-bd-form');
      if (!form) return;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = (document.getElementById('az-bd-text').value || '').trim();
        if (!text) return;
        const prio = document.getElementById('az-bd-priority').value || 'med';
        this.add(text, prio);
        document.getElementById('az-bd-text').value = '';
        document.getElementById('az-bd-text').focus();
      });

      const clear = document.getElementById('az-bd-clear-done');
      if (clear) clear.addEventListener('click', () => {
        if (confirm('Clear all completed items?')) this.clearDone();
      });

      const list = document.getElementById('az-bd-list');
      if (list) {
        list.addEventListener('click', (e) => {
          const del = e.target.closest('[data-bd-delete]');
          if (del) {

          const chk = e.target.closest('[data-bd-done]');

        });
      }

      this.render();

  };

  document.addEventListener('DOMContentLoaded', () => AZBrainDump.init());
  document.addEventListener('az-view-shown', (e) => {
    if (e.detail &amp;&amp; e.detail.name === 'brain-dump') AZBrainDump.render();

  <script>
/* AZOUMAG Planner — Export: CSV per section + Print all or single section */
(function () {
  'use strict';

  function csvEscape(v) {
    if (v == null) return '';
    const s = String(v);
    if (/[&quot;,\n\r]/.test(s)) return '&quot;' + s.replace(/&quot;/g, '&quot;&quot;') + '&quot;';
    return s;
  }

  function toCsv(headers, rows) {
    const head = headers.map(csvEscape).join(',');
    const body = rows.map(r => headers.map(h => csvEscape(r[h])).join(',')).join('\r\n');
    return head + '\r\n' + body + '\r\n';
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function filename(kind, ext) {
    const s = AZStorage.getSettings();
    const shop = (s.plannerName || 'planner').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'planner';
    const date = new Date().toISOString().slice(0, 10);
    return `azoumag-planner-${shop}-${kind}-${date}.${ext || 'csv'}`;
  }

  const AZExport = {
    yearGoalsCsv() {
      const headers = ['goal', 'category', 'quarter', 'deadline', 'status', 'progressPct', 'successMetric', 'nextAction'];
      const rows = AZStorage.getYearGoals().map(g => ({
        goal: g.goal || '',
        category: g.category || '',
        quarter: g.quarter || '',
        deadline: g.deadline || '',
        status: g.status || '',
        progressPct: Math.round((g.progress || 0) * 100),
        successMetric: g.successMetric || '',
        nextAction: g.nextAction || '',
      }));
      download(filename('year-goals'), toCsv(headers, rows));
    },

    habitsCsv() {
      const habits = AZStorage.getHabits();
      const dateSet = new Set();
      habits.forEach(h => Object.keys(h.values || {}).forEach(k => dateSet.add(k)));
      const dates = Array.from(dateSet).sort();
      const headers = ['habit', 'category', 'target', ...dates];
      const rows = habits.map(h => {
        const row = { habit: h.habit || '', category: h.category || '', target: h.target || '' };
        dates.forEach(d => {
          const v = (h.values || {})[d];
          row[d] = v === 1 ? 'done' : v === 0 ? 'missed' : '';
        });
        return row;
      });
      download(filename('habits'), toCsv(headers, rows));
    },

    notesCsv() {
      const headers = ['title', 'body', 'updatedAt'];
      const rows = AZStorage.getNotes()
        .slice()
        .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
        .map(n => ({ title: n.title || '', body: n.body || '', updatedAt: n.updatedAt || '' }));
      download(filename('notes'), toCsv(headers, rows));
    },

    brainDumpCsv() {
      const headers = ['text', 'priority', 'done', 'createdAt'];
      const rows = AZStorage.getBrainDump().map(x => ({
        text: x.text || '',
        priority: x.priority || 'med',
        done: x.done ? 'yes' : 'no',
        createdAt: x.createdAt || '',
      }));
      download(filename('brain-dump'), toCsv(headers, rows));
    },

    printAll() {
      const root = document.getElementById('az-planner');
      if (root) root.removeAttribute('data-print-section');
      window.print();
    },

    printSection(name) {
      const root = document.getElementById('az-planner');
      if (!root) return;
      root.setAttribute('data-print-section', name);
      // Give the browser a tick to apply the attribute before printing
      setTimeout(() => {
        window.print();
        // Clean up on next tick after print dialog closes (safe either way)
        setTimeout(() => root.removeAttribute('data-print-section'), 500);
      }, 20);
    },

    init() {
      const root = document.getElementById('az-planner');
      if (!root) return;

      root.addEventListener('click', (e) => {
        const exp = e.target.closest('[data-export]');
        if (exp) {
          const kind = exp.getAttribute('data-export');
          try {
            if (kind === 'year-goals') this.yearGoalsCsv();
            else if (kind === 'habits') this.habitsCsv();
            else if (kind === 'notes') this.notesCsv();
            else if (kind === 'brain-dump') this.brainDumpCsv();
          } catch (err) {
            document.dispatchEvent(new CustomEvent('az-toast', { detail: { message: 'Export failed', kind: 'error' } }));
          }
          return;
        }
        const printAll = e.target.closest('[data-print-all]');
        if (printAll) { this.printAll(); return; }
        const printSec = e.target.closest('[data-print-section]');
        if (printSec) this.printSection(printSec.getAttribute('data-print-section'));
      });
    },
  };

  document.addEventListener('DOMContentLoaded', () => AZExport.init());
  window.AZExport = AZExport;
})();

  let toastTimer = null;
  function flash(message, kind) {
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.classList.toggle('az-toast-error', kind === 'error');
    toastEl.classList.add('az-toast-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('az-toast-show'), 2600);
  }
  const flashOk = (m) => flash(m, 'ok');
  const flashErr = (m) => flash(m, 'error');

  // ------- Tabs -------
  function switchTab(name) {
    $$('.az-tab').forEach(t => {
      const active = t.dataset.tab === name;
      t.classList.toggle('az-tab-active', active);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    $$('.az-view').forEach(v => {
      const active = v.id === `az-view-${name}`;
      v.classList.toggle('az-view-active', active);
      if (active) v.removeAttribute('hidden');
      else v.setAttribute('hidden', '');
    });
    try { localStorage.setItem('az_planner_current_tab', name); } catch (e) {}
    document.dispatchEvent(new CustomEvent('az-view-shown', { detail: { name } }));
  }
  const FIRST_BOOT_KEY = 'az_planner_first_boot_done';
  const isFirstBoot = !localStorage.getItem(FIRST_BOOT_KEY);
  const markSeen = () => { try { localStorage.setItem(FIRST_BOOT_KEY, '1'); } catch (e) {} };

  $$('.az-tab').forEach(t => t.addEventListener('click', () => {
    switchTab(t.dataset.tab);
    markSeen();
  }));

  // First boot → land on Settings so the user sees the license section.
  // Otherwise restore the last-used tab.
  if (isFirstBoot) {
    switchTab('settings');
    setTimeout(() => {
      const input = document.getElementById('az-license-input');
      if (input) {
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 120);
  } else {
    try {
      const last = localStorage.getItem('az_planner_current_tab');
      if (last &amp;&amp; $(`#az-view-${last}`)) switchTab(last);
    } catch (e) {}
  }

  // ------- Today date -------
  const todayEl = $('#az-today');
  if (todayEl) {
    const d = new Date();
    todayEl.textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ------- Settings -------
  const settingsForm = $('#az-settings-form');
  const shopNameEl = $('#az-shop-name');
  const setShop = $('#az-set-shop');
  const setYear = $('#az-set-year');
  const setTheme = $('#az-set-theme');

  function hydrateSettings() {
    const s = AZStorage.getSettings();
    if (setShop) setShop.value = s.plannerName || '';
    if (setYear) setYear.value = s.year || new Date().getFullYear();
    if (setTheme) setTheme.value = s.theme || 'base';
    if (shopNameEl) shopNameEl.textContent = s.plannerName || 'Your Planner';
    applyTheme(s.theme || 'base');
  }

  if (settingsForm) {
    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const s = AZStorage.getSettings();
      s.plannerName = setShop ? setShop.value.trim() || 'Your Planner' : s.plannerName;
      s.year = setYear ? parseInt(setYear.value, 10) || s.year : s.year;
      const chosenTheme = setTheme ? setTheme.value : s.theme;
      if (window.AZThemes &amp;&amp; AZThemes.isLocked(chosenTheme)) {
        flashErr('That theme is Pro — activate a key to unlock it');
        setTheme.value = s.theme || 'base';
        return;
      }
      s.theme = chosenTheme;
      AZStorage.saveSettings(s);
      hydrateSettings();
      flashOk('Settings saved');
    });
  }

  // ------- Theme swap (delegates to AZThemes) -------
  function applyTheme(name) {
    if (window.AZThemes) AZThemes.apply(name || 'base');
  }

  // Populate the theme <select> with all registered themes
  if (setTheme &amp;&amp; window.AZThemes) AZThemes.hydrateSelect(setTheme);

  // ------- Product presets -------
  const presetSelect = $('#az-preset-select');
  const presetApply = $('#az-preset-apply');
  if (presetSelect &amp;&amp; window.AZPresets) AZPresets.hydrateSelect(presetSelect);
  if (presetApply) {
    presetApply.addEventListener('click', () => {
      const id = presetSelect ? presetSelect.value : '';
      if (!id) { flashErr('Pick a preset first'); return; }
      const mode = confirm('Merge preset into current data?\nOK = merge · Cancel = replace all planner data')
        ? 'merge' : 'replace';
      if (mode === 'replace' &amp;&amp; !confirm('Really replace all goals, habits and this month\'s plan?')) return;
      const res = AZPresets.apply(id, mode);
      if (res.ok) {
        hydrateSettings();
        flashOk(`Preset applied · ${res.applied.goals} goals · ${res.applied.habits} habits`);
      } else {
        flashErr(res.error || 'Preset failed');
      }
    });
  }

  // ------- Backup / Restore -------
  const backupInfo = $('#az-backup-info');
  function hydrateBackupInfo() {
    if (!backupInfo) return;
    const meta = AZStorage.getMeta();
    if (meta.lastBackupAt) {
      const d = new Date(meta.lastBackupAt);
      backupInfo.textContent = 'Last backup: ' + d.toLocaleString();
    } else {
      backupInfo.textContent = 'Last backup: never';
    }
  }

  const btnExport = $('#az-backup-export');
  if (btnExport) {
    btnExport.addEventListener('click', () => {
      try {
        const payload = AZStorage.exportAll();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = AZStorage.buildBackupFilename();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        AZStorage.markBackupDone();
        hydrateBackupInfo();
        flashOk('Backup downloaded');
      } catch (e) {
        flashErr('Backup failed');
      }
    });
  }

  const fileInput = $('#az-backup-file');
  if (fileInput) {
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files &amp;&amp; e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          if (!confirm('Restore this backup? It will replace your current planner data.')) {
            fileInput.value = '';
            return;
          }
          const res = AZStorage.importAll(payload, 'replace');
          if (res.ok) {
            hydrateSettings();
            hydrateBackupInfo();
            flashOk('Backup restored');
          } else {
            flashErr(res.error || 'Restore failed');
          }
        } catch (err) {
          flashErr('Invalid JSON file');
        }
        fileInput.value = '';
      };
      reader.readAsText(file);
    });
  }

  // ------- Reset -------
  const btnReset = $('#az-reset-data');
  if (btnReset) {
    btnReset.addEventListener('click', () => {
      if (!confirm('Reset ALL planner data? This cannot be undone.')) return;
      if (!confirm('Really reset? Consider downloading a backup first.')) return;
      AZStorage.resetAll();
      hydrateSettings();
      hydrateBackupInfo();
      flashOk('All data reset');
    });
  }

  // ------- License -------
  const licStatus = $('#az-license-status');
  const licInput = $('#az-license-input');
  const licActivateBtn = $('#az-license-activate');
  const licActivateRow = $('#az-license-activate-row');
  const licDeactivateRow = $('#az-license-deactivate-row');
  const licDeactivateBtn = $('#az-license-deactivate');

  function hydrateLicense() {
    if (!window.AZLicense) return;
    const rec = AZLicense.getRecord();
    const pro = AZLicense.isPro();
    if (licStatus) {
      if (pro &amp;&amp; rec) {
        const when = new Date(rec.activatedAt).toLocaleDateString();
        licStatus.textContent = `Status: Pro · activated ${when} · key ends ${rec.key.slice(-8)}`;
      } else {
        licStatus.textContent = 'Status: Free';
      }
    }
    if (licActivateRow)   licActivateRow.hidden   = pro;
    if (licDeactivateRow) licDeactivateRow.hidden = !pro;

    // If the stored theme is now Pro-locked, fall back to base cleanly
    if (window.AZThemes &amp;&amp; window.AZStorage) {
      const s = AZStorage.getSettings();
      if (AZThemes.isLocked(s.theme)) {
        s.theme = 'base';
        AZStorage.saveSettings(s);
        AZThemes.apply('base');
        if (setTheme) setTheme.value = 'base';
      }
    }

    if (setTheme &amp;&amp; window.AZThemes) {
      const cur = setTheme.value;
      AZThemes.hydrateSelect(setTheme);
      if (cur) setTheme.value = cur;
    }
    if (presetSelect &amp;&amp; window.AZPresets) AZPresets.hydrateSelect(presetSelect);
  }

  if (licActivateBtn) {
    licActivateBtn.addEventListener('click', async () => {
      const key = licInput ? licInput.value.trim() : '';
      if (!key) { flashErr('Paste a license key first'); return; }
      licActivateBtn.disabled = true;
      const res = await AZLicense.activate(key);
      licActivateBtn.disabled = false;
      if (res.ok) {
        if (licInput) licInput.value = '';
        flashOk('Pro unlocked · thanks for supporting AZOUMAG');
      } else {
        flashErr(res.error || 'Activation failed');
      }
    });
  }

  if (licDeactivateBtn) {
    licDeactivateBtn.addEventListener('click', () => {
      if (!confirm('Deactivate Pro on this device?')) return;
      AZLicense.deactivate();
      flashOk('License deactivated');
    });
  }

  document.addEventListener('az-license-changed', hydrateLicense);
  document.addEventListener('az-license-changed', markSeen);

  if (window.AZLicense) AZLicense.revalidate().then(hydrateLicense);

  // ------- Version tag -------
  const versionEl = $('#az-version');
  if (versionEl &amp;&amp; window.AZ_PLANNER_VERSION) versionEl.textContent = 'v' + window.AZ_PLANNER_VERSION;

  // ------- Init -------
  hydrateSettings();
  hydrateBackupInfo();
  hydrateLicense();
})();

</script>
</body>
</html>
"></iframe>
